name: Client

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'pulse.client/**'
      - '.github/workflows/client.yml'

permissions:
  contents: read

concurrency:
  group: client-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulse.client/package-lock.json

      - name: Install dependencies
        working-directory: pulse.client
        run: npm ci

      - name: Build client
        working-directory: pulse.client
        env:
          VITE_APP_SOURCE: ${{ github.ref_name }}_android
          VITE_ENVIRONMENT: ${{ github.ref_name }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_LOGIN_WEBCLIENT_ID: ${{ secrets.GOOGLE_LOGIN_WEBCLIENT_ID }}
        run: |
          echo "APP_SOURCE=$VITE_APP_SOURCE"
          echo "ENVIRONMENT=$VITE_ENVIRONMENT"
          echo "API_URL=$VITE_API_URL"
          echo "GOOGLE_LOGIN_WEBCLIENT_ID=$VITE_GOOGLE_LOGIN_WEBCLIENT_ID"

          npx vite build --mode ${{ github.ref_name }}

          echo "=== Checking bundle ==="
          grep -R "development_android" dist || true
          grep -R "$VITE_API_URL" dist || true          

      - name: Inspect built client
        working-directory: pulse.client
        run: |
          echo "=== dist ==="
          find dist -maxdepth 2 -type f | sort

          echo "=== index.html ==="
          cat dist/index.html

      - name: Generate Android App Icons
        working-directory: pulse.client
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: pulse.client
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulse-release.jks"

          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pulse-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Check GitHub signing key
        run: |
          echo "=== GitHub signing key ==="

          keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" |
            grep -E "Alias name:|SHA1:|SHA256:"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Get Android version
        run: |
          CURRENT_VERSION=$(ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            'cat /opt/pulse/versions/${{ github.ref_name }}-android 2>/dev/null || echo 0')

          NEXT_VERSION=$((CURRENT_VERSION + 1))

          echo "ANDROID_PLAYSTORE_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

          echo "Android version: $CURRENT_VERSION -> $NEXT_VERSION"

      - name: Build and publish Android
        working-directory: pulse.client/android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          ./gradlew publishProductionReleaseBundle \
            --track=internal \
            -PversionCode="$ANDROID_PLAYSTORE_VERSION"

      - name: Save Android version
        run: |
          ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            "echo '$ANDROID_PLAYSTORE_VERSION' | sudo tee /opt/pulse/versions/${{ github.ref_name }}-android > /dev/null"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-aab
          path: pulse.client/android/app/build/outputs/bundle/productionRelease/*.aab

  build-ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulse.client/package-lock.json

      - name: Install dependencies
        working-directory: pulse.client
        run: npm ci

      - name: Build client
        working-directory: pulse.client
        env:
          VITE_APP_SOURCE: ${{ github.ref_name }}_ios
          VITE_ENVIRONMENT: ${{ github.ref_name }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_LOGIN_WEBCLIENT_ID: ${{ secrets.GOOGLE_LOGIN_WEBCLIENT_ID }}
        run: |
          npx vite build --mode ${{ github.ref_name }}

      - name: Generate iOS App Icons
        working-directory: pulse.client
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor
        working-directory: pulse.client
        run: npx cap sync ios

      - name: Inspect iOS project
        working-directory: pulse.client
        run: |
          echo "=== iOS project ==="
          find ios -maxdepth 4 -type f | sort

      - name: Build iOS
        working-directory: pulse.client
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build