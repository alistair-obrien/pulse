name: Client

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'pulse.client/**'

concurrency:
  group: client-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulse.client/package-lock.json

      - name: Install dependencies
        working-directory: pulse.client
        run: npm ci

      - name: Build client
        working-directory: pulse.client
        run: npx vite build --mode ${{ github.ref_name }}

      - name: Sync Capacitor
        working-directory: pulse.client
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and publish Android
        working-directory: pulse.client/android
        run: ./gradlew publishProductionReleaseBundle --track=internal