name: API

on:
  push:
    branches:
      - master
      - develop

concurrency:
  group: api-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: dev-registry.pulse-flow.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: pulse.api
          file: pulse.api/Dockerfile
          push: true
          tags: dev-registry.pulse-flow.app/pulse-api:latest

      - name: Deploy API
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan 129.225.184.172 >> ~/.ssh/known_hosts

          ssh ubuntu@129.225.184.172 \
            'cd /opt/pulse/api && sudo docker compose pull api && sudo docker compose up -d api'
