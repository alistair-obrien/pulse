name: API

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'pulse.api/**'

concurrency:
  group: api-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: pulse.api
          file: pulse.api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_IMAGE }}:latest
          build-args: |
            PULSE_VERSION=${{ github.run_number }}
            PULSE_COMMIT_SHA=${{ github.sha }}
            PULSE_BUILD_DATE=${{ env.PULSE_BUILD_DATE }}

      - name: Deploy API
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

          ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            'cd /opt/pulse/api && sudo docker compose pull api && sudo docker compose up -d api'