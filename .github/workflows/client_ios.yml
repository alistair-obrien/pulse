name: iOS Client

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'pulse.client/**'
      - '.github/workflows/client_ios.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-client-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}

    steps:

      # ------------------------------------------------------------
      # Build metadata
      # ------------------------------------------------------------

      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Node
      # ------------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulse.client/package-lock.json

      - name: Install dependencies
        working-directory: pulse.client
        run: npm ci

      # ------------------------------------------------------------
      # Build web client
      # ------------------------------------------------------------

      - name: Build client
        working-directory: pulse.client
        env:
          VITE_APP_SOURCE: ${{ github.ref_name }}_ios
          VITE_ENVIRONMENT: ${{ github.ref_name }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_LOGIN_WEBCLIENT_ID: ${{ secrets.GOOGLE_LOGIN_WEBCLIENT_ID }}
        run: |
          echo "APP_SOURCE=$VITE_APP_SOURCE"
          echo "ENVIRONMENT=$VITE_ENVIRONMENT"
          echo "API_URL=$VITE_API_URL"

          npx vite build --mode ${{ github.ref_name }}

      # ------------------------------------------------------------
      # Capacitor
      # ------------------------------------------------------------

      - name: Generate iOS App Icons
        working-directory: pulse.client
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor
        working-directory: pulse.client
        run: npx cap sync ios

      # ------------------------------------------------------------
      # Apple signing
      # ------------------------------------------------------------

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=== Signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ------------------------------------------------------------
      # Provisioning profile
      # ------------------------------------------------------------

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/App.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p "$PROFILE_DIR"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Application identifier: $PROFILE_APP_ID"
          echo "Profile team: $PROFILE_TEAM_ID"

          cp "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROVISIONING_PROFILE_UUID=$PROFILE_UUID" \
            >> "$GITHUB_ENV"

          echo "IOS_PROVISIONING_PROFILE_NAME_ACTUAL=$PROFILE_NAME" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Version
      # ------------------------------------------------------------

      - name: Get iOS version
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

          CURRENT_VERSION=$(ssh "$SERVER_USER@$SERVER_HOST" \
            'cat /opt/pulse/versions/${{ github.ref_name }}-ios 2>/dev/null || echo 0')

          NEXT_VERSION=$((CURRENT_VERSION + 1))

          echo "IOS_BUILD_NUMBER=$NEXT_VERSION" \
            >> "$GITHUB_ENV"

          echo "iOS build: $CURRENT_VERSION -> $NEXT_VERSION"

      # ------------------------------------------------------------
      # Configure Xcode signing
      #
      # IMPORTANT:
      # Only the App target should receive the manual provisioning
      # profile. Swift Package Manager dependency targets must remain
      # automatic because they do not support provisioning profiles.
      # ------------------------------------------------------------

      - name: Configure Xcode manual signing
        working-directory: pulse.client
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          PROJECT="ios/App/App.xcodeproj/project.pbxproj"

          echo "=== Existing signing settings ==="

          grep -n \
            -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" \
            "$PROJECT" \
            || true

          echo ""
          echo "=== Configuring App target signing ==="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()

          # Only change CODE_SIGN_STYLE on the App project/target.
          #
          # Do NOT globally replace signing settings. Swift Package
          # Manager targets such as GTMAppAuth, Alamofire, AppAuth,
          # GoogleUtilities, and Facebook SDK must remain automatic.

          sections = text.split("/* Begin XCBuildConfiguration section */", 1)

          if len(sections) != 2:
              raise SystemExit("Could not locate XCBuildConfiguration section")

          before, rest = sections

          configs = rest.split("/* End XCBuildConfiguration section */", 1)

          if len(configs) != 2:
              raise SystemExit("Could not locate build configuration section")

          config_text, after = configs

          # The App target's signing settings are supplied through
          # xcodebuild command-line overrides below.
          #
          # Remove any existing manually specified provisioning profile
          # from the project file so package targets cannot inherit it.
          config_text = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;\s*$',
              '',
              config_text,
              flags=re.MULTILINE,
          )

          # Keep the project itself automatic. The App target is switched
          # to manual at archive time using xcodebuild command-line
          # settings. This prevents those settings from propagating into
          # Swift Package targets.
          config_text = re.sub(
              r'^\s*CODE_SIGN_STYLE = Manual;\s*$',
              'CODE_SIGN_STYLE = Automatic;',
              config_text,
              flags=re.MULTILINE,
          )

          path.write_text(
              before
              + "/* Begin XCBuildConfiguration section */"
              + config_text
              + "/* End XCBuildConfiguration section */"
              + after
          )
          PY

          echo ""
          echo "=== Signing settings after cleanup ==="

          grep -n \
            -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" \
            "$PROJECT" \
            || true

      # ------------------------------------------------------------
      # Archive
      # ------------------------------------------------------------

      - name: Archive iOS
        working-directory: pulse.client
        env:
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ env.IOS_PROVISIONING_PROFILE_NAME_ACTUAL }}
        run: |
          echo "=== Archive signing configuration ==="
          echo "Team: $APPLE_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_IDENTIFIER"
          echo "Profile: $IOS_PROVISIONING_PROFILE_NAME"
          echo "Profile UUID: $IOS_PROVISIONING_PROFILE_UUID"
          echo ""

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ios/build/App.xcarchive \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            archive

      # ------------------------------------------------------------
      # Export options
      # ------------------------------------------------------------

      - name: Create ExportOptions.plist
        working-directory: pulse.client
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ env.IOS_PROVISIONING_PROFILE_NAME_ACTUAL }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$IOS_BUNDLE_IDENTIFIER</key>
                  <string>$IOS_PROVISIONING_PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat ios/ExportOptions.plist

      # ------------------------------------------------------------
      # Export IPA
      # ------------------------------------------------------------

      - name: Export iOS IPA
        working-directory: pulse.client
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/ExportOptions.plist

      # ------------------------------------------------------------
      # Inspect
      # ------------------------------------------------------------

      - name: Inspect IPA
        working-directory: pulse.client
        run: |
          echo "=== IPA ==="
          ls -lah ios/build/export/

          echo ""
          echo "=== Archive ==="
          ls -lah ios/build/App.xcarchive/

      # ------------------------------------------------------------
      # Upload to TestFlight
      # ------------------------------------------------------------

      - name: Upload to TestFlight
        working-directory: pulse.client
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          PRIVATE_KEYS="$RUNNER_TEMP/private_keys"

          mkdir -p "$PRIVATE_KEYS"

          printf '%s' "$APPLE_APP_STORE_CONNECT_PRIVATE_KEY" \
            | sed 's/\\n/\n/g' \
            > "$PRIVATE_KEYS/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"

          chmod 600 \
            "$PRIVATE_KEYS/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"

          xcrun iTMSTransporter \
            -m upload \
            -assetFile ios/build/export/*.ipa \
            -apiKey "$APPLE_APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APPLE_APP_STORE_CONNECT_ISSUER_ID"

      # ------------------------------------------------------------
      # Save version
      # ------------------------------------------------------------

      - name: Save iOS version
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            "echo '$IOS_BUILD_NUMBER' | sudo tee /opt/pulse/versions/${{ github.ref_name }}-ios > /dev/null"

      # ------------------------------------------------------------
      # GitHub artifact
      # ------------------------------------------------------------

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ios-ipa
          path: pulse.client/ios/build/export/*.ipa