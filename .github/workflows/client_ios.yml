name: iOS Client

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'pulse.client/**'
      - '.github/workflows/client_ios.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-client-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}

    steps:

      # ------------------------------------------------------------
      # Build metadata
      # ------------------------------------------------------------

      - name: Set build metadata
        run: |
          echo "PULSE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Node
      # ------------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulse.client/package-lock.json

      - name: Install dependencies
        working-directory: pulse.client
        run: npm ci

      # ------------------------------------------------------------
      # Build web client
      # ------------------------------------------------------------

      - name: Build client
        working-directory: pulse.client
        env:
          VITE_APP_SOURCE: ${{ github.ref_name }}_ios
          VITE_ENVIRONMENT: ${{ github.ref_name }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_LOGIN_WEBCLIENT_ID: ${{ secrets.GOOGLE_LOGIN_WEBCLIENT_ID }}
        run: |
          echo "APP_SOURCE=$VITE_APP_SOURCE"
          echo "ENVIRONMENT=$VITE_ENVIRONMENT"
          echo "API_URL=$VITE_API_URL"

          npx vite build --mode ${{ github.ref_name }}

      # ------------------------------------------------------------
      # Capacitor
      # ------------------------------------------------------------

      - name: Generate iOS App Icons
        working-directory: pulse.client
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor
        working-directory: pulse.client
        run: npx cap sync ios

      # ------------------------------------------------------------
      # Apple signing
      # ------------------------------------------------------------

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "" \
            "$KEYCHAIN_PATH"

          echo "=== Signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=== Keychain identities ==="

          security find-certificate \
            -a \
            -c "iPhone Distribution" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=== Private keys ==="

          security find-key \
            "$KEYCHAIN_PATH"

      # ------------------------------------------------------------
      # Provisioning profile
      # ------------------------------------------------------------

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/App.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p "$PROFILE_DIR"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Application identifier: $PROFILE_APP_ID"
          echo "Profile team: $PROFILE_TEAM_ID"

          cp "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROVISIONING_PROFILE_UUID=$PROFILE_UUID" \
            >> "$GITHUB_ENV"

          echo "IOS_PROVISIONING_PROFILE_NAME_ACTUAL=$PROFILE_NAME" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Version
      # ------------------------------------------------------------

      - name: Get iOS version
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

          CURRENT_VERSION=$(ssh "$SERVER_USER@$SERVER_HOST" \
            'cat /opt/pulse/versions/${{ github.ref_name }}-ios 2>/dev/null || echo 0')

          NEXT_VERSION=$((CURRENT_VERSION + 1))

          echo "IOS_BUILD_NUMBER=$NEXT_VERSION" \
            >> "$GITHUB_ENV"

          echo "iOS build: $CURRENT_VERSION -> $NEXT_VERSION"

      # ------------------------------------------------------------
      # Archive
      #
      # IMPORTANT:
      #
      # The archive is intentionally unsigned.
      #
      # Do NOT pass:
      #
      #   CODE_SIGN_STYLE
      #   CODE_SIGN_IDENTITY
      #   PROVISIONING_PROFILE_SPECIFIER
      #
      # as xcodebuild command-line settings here.
      #
      # Command-line signing settings propagate into Swift Package
      # Manager targets, which causes targets such as GoogleSignIn,
      # AppAuth, GoogleUtilities, Facebook and Alamofire to reject
      # the provisioning profile.
      #
      # Distribution signing happens during exportArchive.
      # ------------------------------------------------------------

      - name: Archive iOS
        working-directory: pulse.client
        env:
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
        run: |
          echo "=== Archive configuration ==="
          echo "Team: $APPLE_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_IDENTIFIER"
          echo "Build: $IOS_BUILD_NUMBER"
          echo ""

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ios/build/App.xcarchive \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      # ------------------------------------------------------------
      # Export options
      # ------------------------------------------------------------

      - name: Create ExportOptions.plist
        working-directory: pulse.client
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ env.IOS_PROVISIONING_PROFILE_NAME_ACTUAL }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>

              <key>signingCertificate</key>
              <string>iPhone Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$IOS_BUNDLE_IDENTIFIER</key>
                  <string>$IOS_PROVISIONING_PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat ios/ExportOptions.plist

      # ------------------------------------------------------------
      # Export IPA
      #
      # This is where the App Store signing happens.
      # ------------------------------------------------------------

      - name: Export iOS IPA
        working-directory: pulse.client
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/ExportOptions.plist

      # ------------------------------------------------------------
      # Inspect
      # ------------------------------------------------------------

      - name: Inspect IPA
        working-directory: pulse.client
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
        run: |
          echo "=== IPA ==="

          ls -lah ios/build/export/

          IPA_PATH=$(find ios/build/export \
            -name "*.ipa" \
            -type f \
            | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA was produced."
            exit 1
          fi

          echo ""
          echo "IPA:"
          echo "$IPA_PATH"

          echo ""
          echo "=== Archive ==="

          ls -lah ios/build/App.xcarchive/

          echo ""
          echo "=== IPA signing inspection ==="

          mkdir -p ios/build/ipa-inspect

          unzip -q \
            "$IPA_PATH" \
            -d ios/build/ipa-inspect

          APP_PATH=$(find ios/build/ipa-inspect/Payload \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          echo "App:"
          echo "$APP_PATH"

          echo ""
          echo "=== Code signature ==="

          codesign \
            -dvv \
            "$APP_PATH" \
            2>&1 \
            || true

          echo ""
          echo "=== Embedded provisioning profile ==="

          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            security cms \
              -D \
              -i "$APP_PATH/embedded.mobileprovision" \
              > ios/build/exported-profile.plist

            echo "Embedded provisioning profile found."

            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              ios/build/exported-profile.plist

            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              ios/build/exported-profile.plist
          else
            echo "WARNING: No embedded.mobileprovision found."
          fi

      # ------------------------------------------------------------
      # Upload to TestFlight
      # ------------------------------------------------------------

      - name: Upload to TestFlight
        working-directory: pulse.client
        env:
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          PRIVATE_KEYS="$RUNNER_TEMP/private_keys"

          mkdir -p "$PRIVATE_KEYS"

          printf '%s' "$APPLE_APP_STORE_CONNECT_PRIVATE_KEY" \
            | sed 's/\\n/\n/g' \
            > "$PRIVATE_KEYS/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"

          chmod 600 \
            "$PRIVATE_KEYS/AuthKey_${APPLE_APP_STORE_CONNECT_KEY_ID}.p8"

          IPA_PATH=$(find ios/build/export \
            -name "*.ipa" \
            -type f \
            | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo "Uploading:"
          echo "$IPA_PATH"

          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "$APPLE_APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APPLE_APP_STORE_CONNECT_ISSUER_ID"

      # ------------------------------------------------------------
      # Save version
      # ------------------------------------------------------------

      - name: Save iOS version
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            "echo '$IOS_BUILD_NUMBER' | sudo tee /opt/pulse/versions/${{ github.ref_name }}-ios > /dev/null"

      # ------------------------------------------------------------
      # GitHub artifact
      # ------------------------------------------------------------

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ios-ipa
          path: pulse.client/ios/build/export/*.ipa