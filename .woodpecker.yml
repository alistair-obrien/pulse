# Example: Limiting concurrent executions to avoid race conditions
when:
  event: push

concurrency:
  limit: 1                    # Only 1 instance of this workflow can run at a time
  action: queue               # Holds subsequent triggers in the queue safely

steps:
  build:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet restore pulse.api/Pulse.Api/Pulse.Api.csproj
      - dotnet build pulse.api/Pulse.Api/Pulse.Api.csproj -c Release --no-restore
  
  docker:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: dev-registry.pulse-flow.app/pulse-api
      registry: dev-registry.pulse-flow.app
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      tags:
        - latest
  